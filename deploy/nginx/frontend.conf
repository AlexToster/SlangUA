# nginx inside the `frontend` image. It only ever sees traffic from the host
# nginx (the TLS terminator), so TLS, HSTS, CSP and the request limiter live
# there and are deliberately absent here. This file has one job: serve the built
# SPA with cache headers that match how Vite names its output.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets only. The bundle's .webp style tiles and the .png icons are
    # already compressed, and gzipping them costs CPU for nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Everything under /assets/ carries a content hash in its filename
    # (index-ChT6s_QG.js, street-CnTZ9QGc.webp), so a changed file is a changed
    # URL and the old one can never be served stale. `immutable` additionally
    # stops the browser from revalidating on reload, which is the difference
    # between a Mini App that opens instantly on a mobile connection and one that
    # waits for a round of 304s first.
    #
    # `expires` is deliberately not used here or below: it emits its own
    # Cache-Control, so combining the two sends the header twice. `^~` stops nginx
    # from consulting the regex location further down, so the caching rule for
    # hashed assets cannot be overtaken by the rule for the unhashed root files.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the document that names the hashed
    # bundles, so a cached copy pins the client to the previous release and, after
    # the old assets are gone, to a blank screen. This is exactly the failure that
    # kept an authenticated admin bouncing back to the root screen before the
    # bundle was rebuilt - the client was running code the server had moved past.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The unhashed root files (favicon.svg, icons.svg) change only with a release
    # and are cheap to refetch: an hour is short enough that a new icon set
    # appears the same day, long enough to keep them off the critical path.
    location ~* ^/[^/]+\.(svg|png|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
