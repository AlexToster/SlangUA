services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slangua
      POSTGRES_USER: slangua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slangua -d slangua"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://slangua:${POSTGRES_PASSWORD}@db:5432/slangua?schema=public
      REDIS_URL: redis://redis:6379
    command: sh -c "npx prisma migrate deploy && node dist/app.js"
    # Readiness, not liveness: the container is only "healthy" while Postgres and
    # Redis answer, because with Redis down the rate limiter fails closed and every
    # translate request returns 503. `node -e` is used instead of curl/wget — the
    # slim base image ships neither, and Node 22 has a global fetch(). start_period
    # covers `prisma migrate deploy` before the server starts listening.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

  # Daily `pg_dump` into a host directory. Deliberately the same image tag as
  # `db`: an older pg_dump refuses a newer server outright, so the two tags must
  # be upgraded together.
  #
  # The script is bind-mounted rather than baked into an image, so a fix to the
  # schedule needs no rebuild - but it does need `up -d --force-recreate
  # db-backup` and not `restart`. A single-file bind mount follows the inode: an
  # editor (or a deploy that copies the tree in) writes a new file, and the
  # running container keeps executing the deleted one. It never connects over the
  # published port - `PGHOST: db` stays on the compose network, so backups keep
  # working even if the loopback publications change.
  #
  # Runs as root (the entrypoint override skips the image's step-down to the
  # postgres user), so the dumps land root-owned in BACKUP_DIR. The script sets
  # `umask 077` on top of that, because root-owned files are still 0644 by
  # default and a plain SQL dump of the whole database must not be readable by
  # every account on the host. See docs/operations.md for the restore procedure.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/backup-postgres.sh"]
    environment:
      PGHOST: db
      PGUSER: slangua
      PGDATABASE: slangua
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
