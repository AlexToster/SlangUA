name: CI

# Two independent jobs: the backend needs Docker (testcontainers spins up
# Postgres and Redis), the frontend does not. Splitting them keeps a frontend-only
# change from waiting on container startup.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both jobs pin actions/checkout and actions/setup-node at v5 — the first majors
# whose JS runtime is Node 24. The v4 line still targets Node 20, which the
# runners force onto Node 24 with a deprecation warning today and remove on
# 2026-09-16. No input changes came with either bump; setup-node v5 only dropped
# its dummy NODE_AUTH_TOKEN fallback, which needs `registry-url` to matter here.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Everything below needs the generated client: tsc reads its types and the
      # integration global-setup imports PrismaClient before starting containers.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run test:typecheck

      # Builds, then asserts every style loads with a non-empty lexicon and a
      # prompt free of dangling lexicon lines.
      - name: Style Engine smoke test
        run: npm run test:smoke

      - name: Unit tests
        run: npm run test:unit

      # testcontainers uses the Docker daemon preinstalled on the runner and
      # applies prisma migrations itself; no service containers are declared here.
      - name: Integration tests
        run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The READMEs are a mirror pair, and drift between them is silent: nothing
  # breaks, the English page just quietly starts lying. This job needs no
  # dependencies at all - the script is plain Node with built-ins only - so a
  # docs-only PR gets its answer in seconds instead of waiting on containers.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: README parity
        run: node scripts/check-readme-parity.mjs
