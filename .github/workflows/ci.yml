name: CI

# Two independent jobs: the backend needs Docker (testcontainers spins up
# Postgres and Redis), the frontend does not. Splitting them keeps a frontend-only
# change from waiting on container startup.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Everything below needs the generated client: tsc reads its types and the
      # integration global-setup imports PrismaClient before starting containers.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run test:typecheck

      # Builds, then asserts every style loads with a non-empty lexicon and a
      # prompt free of dangling lexicon lines.
      - name: Style Engine smoke test
        run: npm run test:smoke

      - name: Unit tests
        run: npm run test:unit

      # testcontainers uses the Docker daemon preinstalled on the runner and
      # applies prisma migrations itself; no service containers are declared here.
      - name: Integration tests
        run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
