openapi: 3.0.3
info:
  title: SlangUA API
  version: 1.0.0
  description: >
    REST API для SlangUA — Telegram Mini App, що стилізує український текст у різні
    сучасні стилі мовлення.

    Ця специфікація згенерована на основі plans/docs/04-api.md, яка лишається
    джерелом правди для контрактів. Оновлюйте обидва документи синхронно зі змінами
    в src/routes/** та src/services/**.
servers:
  - url: /api/v1
    description: Версіонований базовий шлях (за проксі /api → backend)

tags:
  - name: Auth
    description: Автентифікація через Telegram initData та керування сесією
  - name: Translate
    description: Переклад/стилізація тексту, preview/save та inline-share
  - name: Styles
    description: Доступні стилі стилізації
  - name: History
    description: Історія перекладів користувача
  - name: User
    description: Профіль та налаштування користувача

paths:
  /auth/telegram:
    post:
      tags: [Auth]
      summary: Обмін Telegram initData на JWT access token
      description: >
        Перевіряє HMAC-SHA256 та TTL `auth_date`, створює/оновлює користувача,
        повертає access token у тілі й ставить refresh (`slangua_refresh`, HttpOnly)
        та читабельний `slangua_csrf` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  description: Сирий рядок Telegram WebAppData
      responses:
        '200':
          description: Успішна автентифікація
          headers:
            Set-Cookie:
              description: Ставить slangua_refresh (HttpOnly) та slangua_csrf cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Ротація refresh-токена та видача нового access token
      description: >
        Refresh-токен передається лише в HttpOnly cookie `slangua_refresh`.
        Клієнт має надіслати заголовок `X-CSRF-Token`, що збігається з `slangua_csrf`.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Токени зротовані
          headers:
            Set-Cookie:
              description: Оновлює slangua_refresh (HttpOnly) та slangua_csrf cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Інвалідизація поточного refresh-токена
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сесію завершено
        '401':
          $ref: '#/components/responses/Error'

  /translate/preview:
    post:
      tags: [Translate]
      summary: Переклад для попереднього перегляду (без збереження)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
      responses:
        '200':
          description: Результат preview (запис у БД не створюється)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /translate/save:
    post:
      tags: [Translate]
      summary: Збереження перекладу з preview (ідемпотентно, без виклику LLM)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewId]
              properties:
                previewId:
                  type: string
                  format: uuid
                  description: Ідентифікатор preview із POST /translate/preview
      responses:
        '200':
          description: Створений запис Translation (точний текст із preview)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /translate:
    post:
      tags: [Translate]
      summary: Переклад у стиль і збереження (прямий шлях)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslateRequest'
      responses:
        '200':
          description: Створений запис Translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /share/inline:
    post:
      tags: [Translate]
      summary: Створення короткоживучого токена для Telegram inline-share
      description: >
        Приймає рівно одне джерело — previewId або translationId (сирий текст ніколи
        не приймається). Потребує production-конфігурації inline-бота.
        Див. plans/docs/09-telegram-sharing.md.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [previewId]
                  properties:
                    previewId:
                      type: string
                      format: uuid
                - type: object
                  required: [translationId]
                  properties:
                    translationId:
                      type: integer
      responses:
        '200':
          description: Токен для inline-share
          content:
            application/json:
              schema:
                type: object
                properties:
                  inlineQuery:
                    type: string
                    example: s_<opaque-token>
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /styles:
    get:
      tags: [Styles]
      summary: Список доступних стилів (з урахуванням підтвердження віку)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Доступні стилі
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Значення enum SlangStyle (напр., GEN_Z)
                    title:
                      type: string
        '401':
          $ref: '#/components/responses/Error'

  /history:
    get:
      tags: [History]
      summary: Пагінований список перекладів користувача
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Непрозорий keyset-курсор (nextCursor); не конструювати вручну
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Пошук без урахування регістру за originalText і translatedText
      responses:
        '200':
          description: Сторінка результатів
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Translation'
                  nextCursor:
                    type: string
                    nullable: true
                  totalCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Error'

  /history/{id}/favorite:
    patch:
      tags: [History]
      summary: Перемкнути прапорець favorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TranslationId'
      responses:
        '200':
          description: Оновлений запис Translation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Translation'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /history/{id}:
    delete:
      tags: [History]
      summary: Видалити запис перекладу
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TranslationId'
      responses:
        '204':
          description: Видалено
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /user/me:
    get:
      tags: [User]
      summary: Профіль поточного користувача
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профіль користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      tags: [User]
      summary: Оновити налаштування рівня застосунку
      description: >
        Telegram-поля (telegramId, username, firstName, lastName, languageCode)
        незмінні через API. Невідомі поля відхиляються з 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                defaultSlangStyle:
                  $ref: '#/components/schemas/SlangStyle'
                notificationsEnabled:
                  type: boolean
                ageConfirmedAdult:
                  type: boolean
      responses:
        '200':
          description: Оновлений профіль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: slangua_refresh
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Значення з cookie slangua_csrf (double-submit CSRF)
    TranslationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Первинний ключ Translation
  responses:
    Error:
      description: Стандартна помилка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
    SlangStyle:
      type: string
      enum: [GEN_Z, STREET, IT_SLANG, POFENI, KANCLER]
    AIProvider:
      type: string
      enum: [OPENAI, ANTHROPIC, GEMINI, OLLAMA, OPENROUTER]
    TranslateRequest:
      type: object
      required: [text, style]
      properties:
        text:
          type: string
          description: >
            1–1000 Unicode grapheme clusters після trim; whitespace-only відхиляється;
            санітизується проти prompt injection
        style:
          $ref: '#/components/schemas/SlangStyle'
    PreviewResult:
      type: object
      properties:
        originalText:
          type: string
        translatedText:
          type: string
        slangStyle:
          $ref: '#/components/schemas/SlangStyle'
        aiProvider:
          $ref: '#/components/schemas/AIProvider'
        previewId:
          type: string
          format: uuid
    Translation:
      type: object
      properties:
        id:
          type: integer
        originalText:
          type: string
        translatedText:
          type: string
        slangStyle:
          $ref: '#/components/schemas/SlangStyle'
        aiProvider:
          $ref: '#/components/schemas/AIProvider'
        favorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        languageCode:
          type: string
          nullable: true
        defaultSlangStyle:
          allOf:
            - $ref: '#/components/schemas/SlangStyle'
          nullable: true
        notificationsEnabled:
          type: boolean
        ageConfirmedAdult:
          type: boolean
        createdAt:
          type: string
          format: date-time
